<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ejercicio 2</title>
</head>
<body>
  <h1>Secuencia de imágenes</h1>

  <img id="imagen" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzVysmJRYX55ZCQR6kp7rMVqKFV4ybpQLRhI07iG4hyQ&s=10" onclick="siguiente()">

  <script>
    var imagenes = [
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSf2cuZGHrhaY66-WZgNmlGEU26OJZU_2DEmrHB-MtC6A&s=10",
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9PrXK63UqCuArhbVFn2VjppVsafvFpRBeuUs7lNG8DA&s=10",
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6CCoE9OlbBZir891It7BHN2lUpaVt6EdwQd1t76XF9A&s=10",
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTwheiS8XxjQr5K0zdHACmr9NBrdbeT80rKc3L5vLVt4g&s=10"
    ];
    var posicion = 0;

    function siguiente() {
      posicion = posicion + 1;
      if (posicion == imagenes.length) {
        posicion = 0;
      }
      document.getElementById("imagen").src = imagenes[posicion];
    }
  </script>
</body>
</html>
